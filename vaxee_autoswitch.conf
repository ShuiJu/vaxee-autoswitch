# VAXEE AutoSwitch configuration
# Updates made from the tray GUI are written back immediately.

interval_seconds=1

hit_mode=competitive_ms_off
hit_poll=4000
hit_traj=smooth_sensitive

default_mode=standard_ms_on
default_poll=1000
default_traj=smooth_sensitive

# whitelist process names, one per line
kook.exe
cs2.exe
rainbow6.exe
